services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  - type: web
    name: ehrqueryengine-backend
    runtime: python
    plan: standard  # Professional plan instance
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Single worker: the warehouse is a single-file DuckDB on the mounted disk,
    # and DuckDB allows only one writer process. Multiple workers cause
    # "Conflicting lock" errors. Scale via a client/server DB (e.g. Postgres)
    # rather than more workers.
    startCommand: python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DUCKDB_PATH
        value: /opt/render/project/data/warehouse.duckdb
      - key: PDF_UPLOAD_DIR
        value: /opt/render/project/data/pdfs
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: openai
      # Secret — Render will prompt for this value on deploy (never stored in
      # the repo). Required for LLM name/address detection in de-identification
      # and for real natural-language query. Without it, de-id runs regex-only.
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: ehrdata-storage
      mountPath: /opt/render/project/data
      sizeGB: 10

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: ehrqueryengine-frontend
    runtime: node
    plan: standard  # Professional plan instance
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ehrqueryengine-backend.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
